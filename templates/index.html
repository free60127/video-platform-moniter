<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全平台数据统计</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6f9; color: #1f2937; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .k { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .card .v { font-size: 24px; font-weight: 700; }
  .card .s { font-size: 12px; color: #10b981; margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 16px 0 10px; flex-wrap: wrap; }
  button { background: #2563eb; color: #fff; border: 0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .plats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .plat { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .plat .name { font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .plat .fans { font-size: 26px; font-weight: 800; color: #0f172a; margin: 8px 0 2px; }
  .plat .meta { font-size: 12px; color: #6b7280; line-height: 1.7; }
  .plat .delta.up { color: #10b981; font-weight: 700; }
  .plat .delta.flat { color: #9ca3af; }
  .plat .err { color: #ef4444; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  th, td { padding: 8px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #f1f3f5; }
  th { background: #f8fafc; color: #475569; font-weight: 600; white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .title-cell { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec-title { font-size: 16px; font-weight: 700; margin: 26px 0 10px; }
  .logs { background: #0f172a; color: #cbd5e1; border-radius: 12px; padding: 12px; font-size: 12px; font-family: Consolas, monospace; height: 260px; overflow-y: auto; line-height: 1.8; }
  .badge { display:inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; background: #eef2ff; color: #4338ca; }
  .muted { color: #9ca3af; }
  .trend-box { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .trend-box canvas { width: 100%; height: 280px; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: #475569; }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  select { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; max-width: 420px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 全平台数据统计</h1>
  <div class="sub">跨屏数据统计器 · 抖音 / 快手 / 腾讯视频号 / 小红书 / B站 · 每日自动采集，也可手动刷新</div>

  <div class="cards">
    <div class="card"><div class="k">总粉丝（有数据平台）</div><div class="v" id="c-fans">--</div><div class="s" id="c-fans-delta"></div></div>
    <div class="card"><div class="k">总播放（最新快照）</div><div class="v" id="c-views">--</div></div>
    <div class="card"><div class="k">总点赞</div><div class="v" id="c-likes">--</div></div>
    <div class="card"><div class="k">作品总数（各平台）</div><div class="v" id="c-works">--</div><div class="s" id="c-time"></div></div>
  </div>

  <div class="toolbar">
    <button id="btn-collect">🔄 立即采集</button>
    <span class="muted" id="collect-hint">采集会依次打开 5 个平台后台（约 2 分钟），不打扰发布器</span>
  </div>

  <div class="plats" id="plats"></div>

  <div class="sec-title">作品明细（各平台最新一次快照）</div>
  <div id="tables"></div>

  <div class="sec-title">📈 单条视频趋势（多平台对比）</div>
  <div class="toolbar">
    <select id="trend-video"><option value="">— 选择视频 —</option></select>
    <select id="trend-metric">
      <option value="views">播放</option>
      <option value="likes">点赞</option>
      <option value="comments">评论</option>
      <option value="collects">收藏</option>
      <option value="shares">分享</option>
    </select>
    <span class="muted">选择任意一条视频，看它在各平台每次采集的走势（平台同时长自动对比）</span>
  </div>
  <div class="trend-box"><canvas id="trend-canvas"></canvas><div class="legend" id="trend-legend"></div></div>
  <div class="muted" id="trend-empty" style="margin-top:8px">尚未选择视频</div>

  <div class="sec-title">采集日志</div>
  <div class="logs" id="logs"></div>
</div>

<script>
let lastLogIdx = 0;
const PLAT_NAMES = {douyin:"抖音", kuaishou:"快手", tencent:"腾讯视频号", xiaohongshu:"小红书", bilibili:"B站"};
const fmt = n => (n === null || n === undefined) ? "--" : (typeof n === "number" ? n.toLocaleString() : n);
const clsOfDelta = d => (d === null) ? "flat" : (d > 0 ? "up" : "flat");

async function load() {
  const r = await fetch("/api/dashboard");
  const d = await r.json();
  let totalFans = 0, totalViews = 0, totalLikes = 0, totalWorks = 0, fanPlats = 0;
  const platHtml = [];
  const tableHtml = [];
  for (const pf of d.platforms) {
    const g = d.groups[pf];
    const fi = g.fans_info;
    const fans = fi.fans;
    if (fans !== null && fans !== undefined) { totalFans += fans; fanPlats++; }
    for (const w of g.works) {
      if (w.views) totalViews += w.views;
      if (w.likes) totalLikes += w.likes;
      totalWorks++;
    }
    const delta = fi.fans_delta;
    let meta = "";
    const ex = fi.extra || {};
    if (ex.last7) meta += `近7日: 播放 ${fmt(ex.last7.views)} · 点赞 ${fmt(ex.last7.likes)} · 涨粉 ${fmt(ex.last7.net_fans)}<br>`;
    if (ex.yesterday) meta += `昨日: 播放 ${fmt(ex.yesterday.new_views)} · 净增关注 ${fmt(ex.yesterday.new_fans)}<br>`;
    if (ex.overview) meta += `昨日: 播放 ${fmt(ex.overview.new_views)} · 涨粉 ${fmt(ex.overview.net_fans)} · 评论 ${fmt(ex.overview.new_comments)}<br>`;
    if (ex.fans_metrics) meta += `涨粉 ${fmt(ex.fans_metrics["粉丝净增"])} · 吸粉 ${fmt(ex.fans_metrics["吸粉量"])} · 脱粉 ${fmt(ex.fans_metrics["脱粉量"])}<br>`;
    if (ex.total_views) meta += `累计: 播放 ${fmt(ex.total_views)} · 赞 ${fmt(ex.total_likes)} · 粉 ${fmt(fans)}<br>`;
    if (ex.follows) meta += `关注 ${fmt(ex.follows)} · 赞藏 ${fmt(ex.total_likes_collects)}<br>`;
    meta += `<span class="muted">采集于 ${(fi.fetch_at || "").slice(5, 16)}</span>`;
    platHtml.push(`<div class="plat">
      <div class="name">${PLAT_NAMES[pf] || pf} <span class="badge">${g.works.length} 作品</span></div>
      <div class="fans">${fmt(fans)} <span style="font-size:13px;color:#6b7280;font-weight:400">粉丝</span></div>
      <div class="meta">${delta !== null ? `<span class="delta ${clsOfDelta(delta)}">${delta > 0 ? "↑" : ""}${fmt(delta)}</span> 较上次 · ` : ""}${meta}</div>
    </div>`);
    const rows = g.works.map(w => `<tr>
      <td class="title-cell" title="${(w.title||"").replace(/"/g,"&quot;")}">${w.title || ""}</td>
      <td class="num muted">${w.pub_datetime || ""}</td>
      <td class="num">${fmt(w.views)}</td><td class="num">${fmt(w.likes)}</td>
      <td class="num">${fmt(w.comments)}</td><td class="num">${fmt(w.collects)}</td><td class="num">${fmt(w.shares)}</td>
    </tr>`).join("");
    tableHtml.push(`<div class="sec-title">${PLAT_NAMES[pf] || pf}</div>
    <table><thead><tr><th>标题</th><th>发布时间</th><th>播放</th><th>点赞</th><th>评论</th><th>收藏</th><th>分享</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="muted">无数据</td></tr>'}</tbody></table>`);
  }
  document.getElementById("c-fans").textContent = fmt(totalFans);
  document.getElementById("c-fans-delta").textContent = `（${fanPlats} 个平台有粉丝数据）`;
  document.getElementById("c-views").textContent = fmt(totalViews);
  document.getElementById("c-likes").textContent = fmt(totalLikes);
  document.getElementById("c-works").textContent = totalWorks;
  document.getElementById("c-time").textContent = `上次采集 ${d.last_collect || "从未"}`;
  document.getElementById("plats").innerHTML = platHtml.join("");
  document.getElementById("tables").innerHTML = tableHtml.join("");
}

async function collect() {
  const btn = document.getElementById("btn-collect");
  btn.disabled = true;
  btn.textContent = "采集中…";
  await fetch("/api/collect", { method: "POST", headers: {"Content-Type": "application/json"}, body: "{}" });
  pollLogs(true);
}
function pollLogs(force) {
  fetch(`/api/logs?idx=${lastLogIdx}`).then(r => r.json()).then(d => {
    if (d.items.length) {
      lastLogIdx = d.last;
      const box = document.getElementById("logs");
      box.innerHTML += d.items.map(it => `<div>[${it[1]}] ${it[2]}</div>`).join("");
      box.scrollTop = box.scrollHeight;
    }
    if (force) {
      const busy = (d.last - window._collectStart || 0);
      setTimeout(() => {
        if (document.getElementById("btn-collect").disabled) {
          fetch("/api/logs?idx=" + lastLogIdx).then(r2 => r2.json()).then(d2 => {
            if (d2.items.some(it => it[2].includes("采集完成"))) {
              document.getElementById("btn-collect").disabled = false;
              document.getElementById("btn-collect").textContent = "🔄 立即采集";
              load();
            } else setTimeout(() => pollLogs(force), 3000);
          });
        }
      }, 3000);
    }
  });
}

document.getElementById("btn-collect").addEventListener("click", collect);
load();
setInterval(() => load(), 60000);
pollLogs(false);
setInterval(() => pollLogs(false), 4000);

// ===== 单条视频趋势 =====
const PLAT_COLORS = { douyin:"#FE2C55", kuaishou:"#FF6A00", tencent:"#07C160", xiaohongshu:"#FF2442", bilibili:"#00A1D6" };
let trendData = null;

async function loadVideoList() {
  try {
    const r = await fetch("/api/videos");
    const d = await r.json();
    const sel = document.getElementById("trend-video");
    sel.innerHTML = '<option value="">— 选择视频 —</option>' +
      (d.titles || []).map(t => `<option value="${(t.title||"").replace(/"/g,"&quot;")}">${t.title}</option>`).join("");
  } catch (e) {}
}

async function loadTrend() {
  const q = document.getElementById("trend-video").value;
  if (!q) { trendData = null; drawTrend(); document.getElementById("trend-empty").textContent = "尚未选择视频"; return; }
  const r = await fetch("/api/trend?video=" + encodeURIComponent(q));
  const d = await r.json();
  trendData = d.history || {};
  drawTrend();
  document.getElementById("trend-empty").textContent = "";
}

function drawTrend() {
  const metric = document.getElementById("trend-metric").value;
  const cv = document.getElementById("trend-canvas");
  const dpr = window.devicePixelRatio || 1;
  const w = cv.parentElement.clientWidth - 28, h = 280;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.height = h + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const legend = document.getElementById("trend-legend");
  legend.innerHTML = "";
  if (!trendData) return;
  const tset = new Set();
  for (const pf in trendData) for (const row of trendData[pf]) tset.add(row.fetch_at);
  const times = [...tset].sort();
  if (!times.length) { legend.innerHTML = '<span class="muted">该视频暂无历史数据</span>'; return; }
  const padL = 46, padR = 16, padT = 14, padB = 34;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  let maxV = 1;
  for (const pf in trendData) for (const row of trendData[pf]) { const v = row[metric]; if (v && v > maxV) maxV = v; }
  maxV = Math.ceil(maxV * 1.08);
  const x = i => padL + (times.length === 1 ? plotW / 2 : plotW * i / (times.length - 1));
  const y = v => padT + plotH - (v / maxV) * plotH;
  // 网格 + y 标签
  ctx.font = "11px sans-serif"; ctx.fillStyle = "#9ca3af"; ctx.strokeStyle = "#eef1f5"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const gv = Math.round(maxV * g / 4), gy = y(gv);
    ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(w - padR, gy); ctx.stroke();
    ctx.fillText(gv >= 1000 ? (gv / 1000).toFixed(1) + "k" : String(gv), 6, gy + 4);
  }
  // x 标签（最多 6 个）
  ctx.fillStyle = "#9ca3af";
  const step = Math.max(1, Math.ceil(times.length / 6));
  for (let i = 0; i < times.length; i += step) {
    ctx.fillText(times[i].slice(5, 16), Math.max(padL, x(i) - 26), h - 12);
  }
  // 各平台折线
  let drew = false;
  for (const pf in trendData) {
    const color = PLAT_COLORS[pf] || "#6b7280";
    const pts = trendData[pf].map(row => {
      const v = row[metric];
      return [x(times.indexOf(row.fetch_at)), v ? y(v) : null];
    });
    if (!pts.some(p => p[1] !== null)) continue;
    drew = true;
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (const [px, py] of pts) {
      if (py === null) { started = false; continue; }
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = color;
    for (const [px, py] of pts) if (py !== null) { ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill(); }
    legend.innerHTML += `<span><i style="background:${color}"></i>${PLAT_NAMES[pf] || pf}</span>`;
  }
  if (!drew) legend.innerHTML = '<span class="muted">该视频暂无数据</span>';
}

document.getElementById("trend-video").addEventListener("change", loadTrend);
document.getElementById("trend-metric").addEventListener("change", drawTrend);
loadVideoList();
</script>
</body>
</html>
